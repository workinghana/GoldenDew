<template>
  <!-- ================= 타이틀 ================= -->

  <div class="title-area">
    <!-- 좌측 타이틀 -->
    <div class="title-left">
      <lightning-icon icon-name="utility:user" size="small"></lightning-icon>
      <h1>회원 요약</h1>
    </div>

    <!-- 우측 버튼 -->
    <div class="action-buttons">
      <lightning-button label="쿠폰 발급" variant="brand" onclick={handleIssueCoupon}></lightning-button>

      <lightning-button label="포인트 지급" variant="neutral" onclick={handleCreditPoints}></lightning-button>

      <lightning-button label="포인트 재정합" variant="brand" onclick={handleOpenReconcile}></lightning-button>
    </div>
  </div>

  <!-- ================= 회원 요약 카드 ================= -->

  <section class="member-summary-grid">
    <!-- 회원 카드 -->

    <div class="summary-card member-card">
      <div class="avatar-circle">
        <lightning-icon icon-name="standard:avatar" size="medium"></lightning-icon>
      </div>

      <div class="member-right">
        <template if:true={member}>
          <div class="member-name-row">
            <span class="member-name">{member.name}</span>
            <span class={memberStatusClass}>{memberStatusLabel}</span>
          </div>

          <div class="member-info-grid">
            <div class="meta-col">
              <p>회원번호 : {memberNumberText}</p>
              <p>법정생년월일 : {birthdateText}</p>
              <p>휴대폰 : {mobilePhoneText}</p>
              <p>
                이메일 :
                <span class="email-text">{emailText}</span>
              </p>
              <p>주소 : {addressText}</p>
              <p>상세 주소 : {addressDetailText}</p>
            </div>

            <div class="meta-col">
              <p>가입일시 : {enrollmentDateText}</p>
              <template if:true={showWithdrawDate}>
                <p>탈퇴일시 : {withdrawDateText}</p>
              </template>

              <p>관리매장 : {storeNameText}</p>
              <p>가입매장 : {signupStoreText}</p>
              <p>결혼유무 : {marriedText}</p>
              <p>결혼기념일 : {weddingDateText}</p>
              <p>휴대폰인증여부 : {mobileVerifiedText}</p>
              <p>회원구분 : {memberTypeText}</p>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- 보유 혜택 -->

    <div class="summary-card kpi-card">
      <div class="card-header">
        <div class="icon-circle purple">
          <lightning-icon icon-name="utility:currency" size="medium"></lightning-icon>
        </div>
        <div class="card-title">보유 혜택</div>
      </div>

      <div class="benefit-row">
        <div class="benefit-item">
          <div class="benefit-value">{ownedPointText}P</div>
          <div class="benefit-label">포인트</div>
        </div>

        <div class="benefit-divider"></div>

        <div class="benefit-item">
          <div class="benefit-value">{ownedCouponText}장</div>
          <div class="benefit-label">쿠폰</div>
        </div>
      </div>
    </div>

    <!-- 회원 등급 -->

    <div class="summary-card kpi-card">
      <div class="card-header">
        <div class="icon-circle blue">
          <lightning-icon icon-name="utility:favorite" size="small"></lightning-icon>
        </div>
        <div class="card-title">회원 등급</div>
      </div>

      <span class={gradeClass}>{currentGrade}</span>

      <div class="divider"></div>

      <div class="grade-detail">
        <div class="grade-money">
          <span class="grade-label">최근 3년 누적 구매금액 : </span>
          <span class="grade-value">₩{totalPurchaseText}</span>
        </div>

        <div class="update-time">(최근 수정일자 : {gradeUpdatedText})</div>

        <div class="grade-money">
          <span class="grade-label">등급 산정 누적 구매금액 : </span>
          <span class="grade-value">₩{tierQualifyingSpendText}</span>
        </div>
      </div>
    </div>

    <!-- 마케팅 수신 -->

    <div class="summary-card kpi-card">
      <div class="card-header">
        <div class="icon-circle green">
          <lightning-icon icon-name="utility:email" size="small"></lightning-icon>
        </div>
        <div class="card-title">마케팅 수신</div>
      </div>

      <div class="marketing-grid">
        <div class="marketing-row">
          <span class="marketing-label">Email 수신</span>
          <span class="marketing-value">{emailConsentLabel}</span>
        </div>

        <div class="marketing-row">
          <span class="marketing-label">SMS 수신</span>
          <span class="marketing-value">{smsConsentLabel}</span>
        </div>

        <div class="marketing-row">
          <span class="marketing-label">DM(매거진)</span>
          <span class="marketing-value">{magazineCatalogLabel}</span>
        </div>

        <div class="marketing-row">
          <span class="marketing-label">매거진 구독</span>
          <span class="marketing-value">{magazinConsentLabel}</span>
        </div>

        <div class="marketing-row marketing-date">
          <span class="marketing-label">구독 날짜</span>
          <span class="marketing-value">{magazineConsentDateText}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= Flow Modal ================= -->

  <template if:true={isFlowOpen}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <!-- Header -->

        <header class="slds-modal__header">
          <lightning-button-icon icon-name="utility:close" alternative-text="닫기" class="slds-modal__close" onclick={closeFlow}>
          </lightning-button-icon>

          <h2 class="slds-text-heading_medium">{flowTitle}</h2>
        </header>

        <!-- Body -->

        <div class="slds-modal__content slds-p-around_medium">
          <lightning-flow flow-api-name={flowApiName} flow-input-variables={flowInputVariables} onstatuschange={handleFlowStatusChange}>
          </lightning-flow>
        </div>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ================= 포인트 재정합 Modal ================= -->

  <template if:true={isReconcileOpen}>
    <section role="dialog" aria-modal="true" aria-labelledby="reconcile-modal-heading" class="slds-modal slds-fade-in-open reconcile-modal">
      <div class="slds-modal__container reconcile-modal__container">
        <!-- Header -->

        <header class="slds-modal__header reconcile-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            alternative-text="닫기"
            title="닫기"
            size="medium"
            class="slds-modal__close"
            onclick={handleCloseReconcile}
          >
          </lightning-button-icon>

          <div class="reconcile-modal__title-wrap">
            <lightning-icon icon-name="utility:refresh" size="small" class="reconcile-modal__title-icon"></lightning-icon>
            <h2 id="reconcile-modal-heading" class="reconcile-modal__title">포인트 재정합</h2>
          </div>
        </header>

        <!-- Body -->

        <div class="slds-modal__content slds-p-around_large reconcile-modal__content">
          <template if:false={isProgressing}>
            <div class="reconcile-verify-area">
              <button type="button" class="reconcile-verify-btn" onclick={handlePointVerify}>포인트 검증</button>
            </div>
          </template>

          <template if:true={isProgressing}>
            <div class="reconcile-verifying" role="status" aria-live="polite">
              <div class="reconcile-verifying__spinner">
                <lightning-spinner alternative-text="검증 진행 중" size="small" variant="brand"></lightning-spinner>
              </div>

              <div class="reconcile-verifying__title">{progressingTitle}</div>

              <div class="reconcile-verifying__warning">
                <lightning-icon icon-name="utility:warning" size="x-small" class="reconcile-verifying__warning-icon"></lightning-icon>
                <p class="reconcile-verifying__warning-text">{progressingWarningText}</p>
              </div>
            </div>
          </template>
        </div>

        <!-- Footer -->

        <footer class="slds-modal__footer reconcile-modal__footer">
          <lightning-button label="닫기" variant="neutral" onclick={handleCloseReconcile}></lightning-button>
        </footer>

        <!-- 검증 확인 다이얼로그 (모달 내부 오버레이) -->
        <template if:true={isVerifyConfirmVisible}>
          <div class="reconcile-confirm-overlay" role="dialog" aria-modal="true">
            <div class="reconcile-confirm-dialog">
              <p class="reconcile-confirm-dialog__message">
                해당 회원의 포인트 적립·사용·차감 내역이<br />
                정확하게 기록되어 있는지 확인합니다.<br />
                진행하시겠습니까?
              </p>

              <div class="reconcile-result-dialog__actions">
                <lightning-button
                  variant="brand"
                  label="계속 진행"
                  onclick={handleConfirmVerify}
                  class="reconcile-confirm-dialog__btn"
                ></lightning-button>

                <lightning-button
                  variant="neutral"
                  label="취소"
                  onclick={handleCancelVerify}
                  class="reconcile-confirm-dialog__btn"
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>

        <!-- 검증 결과 다이얼로그 (1차 검증 완료) -->
        <template if:true={isVerificationResultModalOpen}>
          <div class="reconcile-confirm-overlay" role="dialog" aria-modal="true">
            <div class="reconcile-confirm-dialog">
              <div class={verificationResultIconWrapClass}>
                <lightning-icon icon-name={verificationResultIconName} size="medium" class={verificationResultIconClass}></lightning-icon>
              </div>

              <h3 class="reconcile-result-dialog__title">포인트 1차 검증이 완료되었습니다</h3>

              <p class="reconcile-confirm-dialog__message">{verificationResultMessage}</p>

              <template if:true={hasVerificationDifference}>
                <div class="reconcile-result-dialog__detail">
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">시스템 잔액</span>
                    <span class="reconcile-result-dialog__detail-value">{lmcBalanceText}</span>
                  </div>
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">계산 잔액</span>
                    <span class="reconcile-result-dialog__detail-value">{calculatedBalanceText}</span>
                  </div>
                  <div class="reconcile-result-dialog__detail-row reconcile-result-dialog__detail-row--diff">
                    <span class="reconcile-result-dialog__detail-label">차이</span>
                    <span class="reconcile-result-dialog__detail-value">{differenceText}</span>
                  </div>
                </div>
              </template>

              <!-- 일치: 확인 버튼 1개 -->
              <template if:true={isVerificationValid}>
                <lightning-button
                  variant="brand"
                  label="확인"
                  onclick={handleCloseVerificationResult}
                  class="reconcile-confirm-dialog__btn"
                ></lightning-button>
              </template>

              <!-- 불일치: 계속 진행 + 취소 2개 -->
              <template if:false={isVerificationValid}>
                <div class="reconcile-result-dialog__actions">
                  <lightning-button
                    variant="brand"
                    label="계속 진행"
                    onclick={handleProceedToFinalReconcile}
                    class="reconcile-confirm-dialog__btn"
                  ></lightning-button>

                  <lightning-button
                    variant="neutral"
                    label="취소"
                    onclick={handleCloseVerificationResult}
                    class="reconcile-confirm-dialog__btn"
                  ></lightning-button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 최종 반영 경고 다이얼로그 (되돌릴 수 없는 액션) -->
        <template if:true={isFinalConfirmVisible}>
          <div class="reconcile-confirm-overlay reconcile-final-overlay" role="alertdialog" aria-modal="true" aria-labelledby="final-confirm-heading">
            <div class="reconcile-final-dialog">
              <div class="reconcile-final-dialog__icon-wrap">
                <lightning-icon icon-name="utility:warning" size="medium" class="reconcile-final-dialog__icon"></lightning-icon>
              </div>

              <h3 id="final-confirm-heading" class="reconcile-final-dialog__title">최종 반영 전 확인이 필요합니다</h3>

              <p class="reconcile-final-dialog__message">
                검증된 포인트 값으로 회원의 포인트를 <strong>최종 반영</strong>합니다.<br />
                반영 이후에는 이전 포인트 상태로 <strong>복원할 수 없으며</strong>,<br />
                본 작업은 즉시 적용됩니다.
              </p>

              <p class="reconcile-final-dialog__caution">신중히 확인하신 후 진행해 주십시오.</p>

              <div class="reconcile-final-dialog__actions">
                <lightning-button
                  variant="brand"
                  label="계속 진행"
                  onclick={handleApplyFinal}
                  class="reconcile-final-dialog__btn reconcile-final-dialog__btn--apply"
                ></lightning-button>

                <lightning-button
                  variant="neutral"
                  label="취소"
                  onclick={handleCancelFinal}
                  class="reconcile-final-dialog__btn reconcile-final-dialog__btn--cancel"
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>

        <!-- 재정합 결과 다이얼로그 (2차 검증 완료) -->
        <template if:true={isRebuildResultModalOpen}>
          <div class="reconcile-confirm-overlay" role="dialog" aria-modal="true">
            <div class="reconcile-confirm-dialog">
              <div class={rebuildResultIconWrapClass}>
                <lightning-icon icon-name={rebuildResultIconName} size="medium" class={rebuildResultIconClass}></lightning-icon>
              </div>

              <h3 class="reconcile-result-dialog__title">{rebuildResultTitle}</h3>

              <p class="reconcile-confirm-dialog__message">{rebuildResultMessage}</p>

              <template if:true={hasRebuildAfterResult}>
                <div class="reconcile-result-dialog__detail">
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">시스템 잔액</span>
                    <span class="reconcile-result-dialog__detail-value">{rebuildAfterSystemBalanceText}</span>
                  </div>
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">계산 잔액</span>
                    <span class="reconcile-result-dialog__detail-value">{rebuildAfterCalculatedBalanceText}</span>
                  </div>
                  <div class={rebuildDifferenceRowClass}>
                    <span class="reconcile-result-dialog__detail-label">차이</span>
                    <span class="reconcile-result-dialog__detail-value">{rebuildAfterDifferenceText}</span>
                  </div>
                </div>
              </template>

              <!-- 정합(차이 0): 확인 1개 -->
              <template if:true={isRebuildDifferenceZero}>
                <lightning-button
                  variant="brand"
                  label="확인"
                  onclick={handleCloseRebuildResult}
                  class="reconcile-confirm-dialog__btn"
                ></lightning-button>
              </template>

              <!-- 차이 있음: 심층 검증 + 취소 2개 -->
              <template if:false={isRebuildDifferenceZero}>
                <div class="reconcile-result-dialog__actions">
                  <lightning-button
                    variant="brand"
                    label="심층 검증"
                    onclick={handleStartDeepVerify}
                    class="reconcile-confirm-dialog__btn"
                  ></lightning-button>

                  <lightning-button
                    variant="neutral"
                    label="취소"
                    onclick={handleCancelRebuildResult}
                    class="reconcile-confirm-dialog__btn"
                  ></lightning-button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 심층 검증 확인 다이얼로그 (3차 진입 전 경고) -->
        <template if:true={isDeepConfirmVisible}>
          <div class="reconcile-confirm-overlay reconcile-final-overlay" role="alertdialog" aria-modal="true">
            <div class="reconcile-final-dialog">
              <div class="reconcile-final-dialog__icon-wrap">
                <lightning-icon icon-name="utility:warning" size="medium" class="reconcile-final-dialog__icon"></lightning-icon>
              </div>

              <h3 class="reconcile-final-dialog__title">거래 이력 기반 심층 검증</h3>

              <p class="reconcile-final-dialog__message">
                회원의 <strong>모든 거래 이력(판매·반품·사용·취소 등)</strong>을<br />
                시간순으로 다시 검증합니다.<br />
                거래량에 따라 다소 시간이 걸릴 수 있습니다.
              </p>

              <p class="reconcile-final-dialog__caution">정말 진행하시겠습니까?</p>

              <div class="reconcile-final-dialog__actions">
                <lightning-button
                  variant="brand"
                  label="확인"
                  onclick={handleConfirmDeepVerify}
                  class="reconcile-final-dialog__btn reconcile-final-dialog__btn--apply"
                ></lightning-button>

                <lightning-button
                  variant="neutral"
                  label="취소"
                  onclick={handleCancelDeepVerify}
                  class="reconcile-final-dialog__btn reconcile-final-dialog__btn--cancel"
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>

        <!-- 심층 검증(3차) 결과 다이얼로그 -->
        <template if:true={isIntegrityResultModalOpen}>
          <div class="reconcile-confirm-overlay" role="dialog" aria-modal="true">
            <div class="reconcile-confirm-dialog">
              <div class={integrityIconWrapClass}>
                <lightning-icon icon-name={integrityIconName} size="medium" class={integrityIconClass}></lightning-icon>
              </div>

              <h3 class="reconcile-result-dialog__title">{integrityResultTitle}</h3>

              <p class="reconcile-confirm-dialog__message">{integritySummary}</p>

              <template if:true={hasIntegrityDifference}>
                <div class="reconcile-result-dialog__detail">
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">기대 잔액</span>
                    <span class="reconcile-result-dialog__detail-value">{integrityExpectedText}</span>
                  </div>
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">실제 잔액</span>
                    <span class="reconcile-result-dialog__detail-value">{integrityActualText}</span>
                  </div>
                  <div class="reconcile-result-dialog__detail-row reconcile-result-dialog__detail-row--diff">
                    <span class="reconcile-result-dialog__detail-label">차이</span>
                    <span class="reconcile-result-dialog__detail-value">{integrityDiffText}</span>
                  </div>
                  <div class="reconcile-result-dialog__detail-row">
                    <span class="reconcile-result-dialog__detail-label">결함 이벤트</span>
                    <span class="reconcile-result-dialog__detail-value">{integrityMismatchCountText}</span>
                  </div>
                </div>
              </template>

              <lightning-button
                variant="brand"
                label="확인"
                onclick={handleCloseIntegrityResult}
                class="reconcile-confirm-dialog__btn"
              ></lightning-button>
            </div>
          </div>
        </template>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>

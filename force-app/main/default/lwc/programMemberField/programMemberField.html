<template>
  <!-- ================= 타이틀 ================= -->

  <div class="title-area">
    <!-- 좌측 타이틀 -->
    <div class="title-left">
      <lightning-icon icon-name="utility:user" size="small"></lightning-icon>
      <h1>회원 요약</h1>
    </div>

    <!-- 우측 버튼 -->
    <div class="action-buttons">
      <lightning-button label="쿠폰 발급" variant="brand" onclick={handleIssueCoupon}></lightning-button>

      <lightning-button label="포인트 지급" variant="neutral" onclick={handleCreditPoints}></lightning-button>

      <lightning-button label="포인트 재정합" variant="brand" onclick={handleOpenReconcile}></lightning-button>
    </div>
  </div>

  <!-- ================= 회원 요약 카드 ================= -->

  <section class="member-summary-grid">
    <!-- 회원 카드 -->

    <div class="summary-card member-card">
      <div class="avatar-circle">
        <lightning-icon icon-name="standard:avatar" size="medium"></lightning-icon>
      </div>

      <div class="member-right">
        <template if:true={member}>
          <div class="member-name-row">
            <span class="member-name">{member.name}</span>
            <span class={memberStatusClass}>{memberStatusLabel}</span>
          </div>

          <div class="member-info-grid">
            <div class="meta-col">
              <p>회원번호 : {memberNumberText}</p>
              <p>법정생년월일 : {birthdateText}</p>
              <p>휴대폰 : {mobilePhoneText}</p>
              <p>
                이메일 :
                <span class="email-text">{emailText}</span>
              </p>
              <p>주소 : {addressText}</p>
              <p>상세 주소 : {addressDetailText}</p>
            </div>

            <div class="meta-col">
              <p>가입일시 : {enrollmentDateText}</p>
              <template if:true={showWithdrawDate}>
                <p>탈퇴일시 : {withdrawDateText}</p>
              </template>

              <p>관리매장 : {storeNameText}</p>
              <p>가입매장 : {signupStoreText}</p>
              <p>결혼유무 : {marriedText}</p>
              <p>결혼기념일 : {weddingDateText}</p>
              <p>휴대폰인증여부 : {mobileVerifiedText}</p>
              <p>회원구분 : {memberTypeText}</p>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- 보유 혜택 -->

    <div class="summary-card kpi-card">
      <div class="card-header">
        <div class="icon-circle purple">
          <lightning-icon icon-name="utility:currency" size="medium"></lightning-icon>
        </div>
        <div class="card-title">보유 혜택</div>
      </div>

      <div class="benefit-row">
        <div class="benefit-item">
          <div class="benefit-value">{ownedPointText}P</div>
          <div class="benefit-label">포인트</div>
        </div>

        <div class="benefit-divider"></div>

        <div class="benefit-item">
          <div class="benefit-value">{ownedCouponText}장</div>
          <div class="benefit-label">쿠폰</div>
        </div>
      </div>
    </div>

    <!-- 회원 등급 -->

    <div class="summary-card kpi-card">
      <div class="card-header">
        <div class="icon-circle blue">
          <lightning-icon icon-name="utility:favorite" size="small"></lightning-icon>
        </div>
        <div class="card-title">회원 등급</div>
      </div>

      <span class={gradeClass}>{currentGrade}</span>

      <div class="divider"></div>

      <div class="grade-detail">
        <div class="grade-money">
          <span class="grade-label">최근 3년 누적 구매금액 : </span>
          <span class="grade-value">₩{totalPurchaseText}</span>
        </div>

        <div class="update-time">(최근 수정일자 : {gradeUpdatedText})</div>

        <div class="grade-money">
          <span class="grade-label">등급 산정 누적 구매금액 : </span>
          <span class="grade-value">₩{tierQualifyingSpendText}</span>
        </div>
      </div>
    </div>

    <!-- 마케팅 수신 -->

    <div class="summary-card kpi-card">
      <div class="card-header">
        <div class="icon-circle green">
          <lightning-icon icon-name="utility:email" size="small"></lightning-icon>
        </div>
        <div class="card-title">마케팅 수신</div>
      </div>

      <div class="marketing-grid">
        <div class="marketing-row">
          <span class="marketing-label">Email 수신</span>
          <span class="marketing-value">{emailConsentLabel}</span>
        </div>

        <div class="marketing-row">
          <span class="marketing-label">SMS 수신</span>
          <span class="marketing-value">{smsConsentLabel}</span>
        </div>

        <div class="marketing-row">
          <span class="marketing-label">DM(매거진)</span>
          <span class="marketing-value">{magazineCatalogLabel}</span>
        </div>

        <div class="marketing-row">
          <span class="marketing-label">매거진 구독</span>
          <span class="marketing-value">{magazinConsentLabel}</span>
        </div>

        <div class="marketing-row marketing-date">
          <span class="marketing-label">구독 날짜</span>
          <span class="marketing-value">{magazineConsentDateText}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= Flow Modal ================= -->

  <template if:true={isFlowOpen}>
    <section role="dialog" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <!-- Header -->

        <header class="slds-modal__header">
          <lightning-button-icon icon-name="utility:close" alternative-text="닫기" class="slds-modal__close" onclick={closeFlow}>
          </lightning-button-icon>

          <h2 class="slds-text-heading_medium">{flowTitle}</h2>
        </header>

        <!-- Body -->

        <div class="slds-modal__content slds-p-around_medium">
          <lightning-flow flow-api-name={flowApiName} flow-input-variables={flowInputVariables} onstatuschange={handleFlowStatusChange}>
          </lightning-flow>
        </div>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

  <!-- ================= 포인트 재정합 Modal ================= -->

  <template if:true={isReconcileOpen}>
    <section role="dialog" aria-modal="true" aria-labelledby="reconcile-modal-heading" class="slds-modal slds-fade-in-open reconcile-modal">
      <div class="slds-modal__container reconcile-modal__container">
        <!-- Header -->

        <header class="slds-modal__header reconcile-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            alternative-text="닫기"
            title="닫기"
            size="medium"
            class="slds-modal__close"
            onclick={handleCloseReconcile}
          >
          </lightning-button-icon>

          <div class="reconcile-modal__title-wrap">
            <lightning-icon icon-name="utility:refresh" size="small" class="reconcile-modal__title-icon"></lightning-icon>
            <h2 id="reconcile-modal-heading" class="reconcile-modal__title">포인트 재정합</h2>
          </div>
        </header>

        <!-- Body -->

        <div class="slds-modal__content slds-p-around_large reconcile-modal__content">
          <template if:false={isVerifying}>
            <div class="reconcile-verify-area">
              <button type="button" class="reconcile-verify-btn" onclick={handleStartVerify}>포인트 검증</button>
            </div>
          </template>

          <template if:true={isVerifying}>
            <div class="reconcile-verifying" role="status" aria-live="polite">
              <div class="reconcile-verifying__spinner">
                <lightning-spinner alternative-text="검증 진행 중" size="small" variant="brand"></lightning-spinner>
              </div>

              <div class="reconcile-verifying__title">포인트 정합성 검증을 진행하고 있습니다</div>

              <div class="reconcile-verifying__warning">
                <lightning-icon icon-name="utility:warning" size="x-small" class="reconcile-verifying__warning-icon"></lightning-icon>
                <p class="reconcile-verifying__warning-text">
                  검증 도중 다른 작업을 수행하시면 데이터 정합성에 오차가 발생할 수 있습니다.<br />
                  완료 알림이 표시될 때까지 잠시만 기다려 주십시오.
                </p>
              </div>
            </div>
          </template>
        </div>

        <!-- Footer -->

        <footer class="slds-modal__footer reconcile-modal__footer">
          <lightning-button label="최종 반영" variant="brand" onclick={handleRequestFinalApply} class="slds-m-right_small"></lightning-button>

          <lightning-button label="닫기" variant="neutral" onclick={handleCloseReconcile}></lightning-button>
        </footer>

        <!-- 검증 확인 다이얼로그 (모달 내부 오버레이) -->
        <template if:true={isVerifyConfirmVisible}>
          <div class="reconcile-confirm-overlay" role="dialog" aria-modal="true">
            <div class="reconcile-confirm-dialog">
              <p class="reconcile-confirm-dialog__message">
                해당 회원의 포인트 정합성 검증을 진행합니다.<br />
                계속하시겠습니까?
              </p>

              <lightning-button variant="brand" label="확인" onclick={handleConfirmVerify} class="reconcile-confirm-dialog__btn"></lightning-button>
            </div>
          </div>
        </template>

        <!-- 최종 반영 경고 다이얼로그 (되돌릴 수 없는 액션) -->
        <template if:true={isFinalConfirmVisible}>
          <div class="reconcile-confirm-overlay reconcile-final-overlay" role="alertdialog" aria-modal="true" aria-labelledby="final-confirm-heading">
            <div class="reconcile-final-dialog">
              <div class="reconcile-final-dialog__icon-wrap">
                <lightning-icon icon-name="utility:warning" size="medium" class="reconcile-final-dialog__icon"></lightning-icon>
              </div>

              <h3 id="final-confirm-heading" class="reconcile-final-dialog__title">최종 반영 전 확인이 필요합니다</h3>

              <p class="reconcile-final-dialog__message">
                검증된 포인트 값으로 회원의 포인트를 <strong>최종 반영</strong>합니다.<br />
                반영 이후에는 이전 포인트 상태로 <strong>복원할 수 없으며</strong>,<br />
                본 작업은 즉시 적용됩니다.
              </p>

              <p class="reconcile-final-dialog__caution">신중히 확인하신 후 진행해 주십시오.</p>

              <div class="reconcile-final-dialog__actions">
                <lightning-button
                  variant="brand"
                  label="계속 진행"
                  onclick={handleApplyFinal}
                  class="reconcile-final-dialog__btn reconcile-final-dialog__btn--apply"
                ></lightning-button>

                <lightning-button
                  variant="neutral"
                  label="취소"
                  onclick={handleCancelFinal}
                  class="reconcile-final-dialog__btn reconcile-final-dialog__btn--cancel"
                ></lightning-button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>

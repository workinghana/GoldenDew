<template>
  <lightning-card title="프로모션 상품 업로드" icon-name="standard:product_request">
    <div class="slds-p-around_medium upload-card-body">
      <lightning-button label="파일 업로드" variant="brand" onclick={handleOpenModal}></lightning-button>
    </div>
  </lightning-card>

  <input class="file-input" type="file" accept=".csv" onchange={handleFileChange} />

  <template if:true={isModalOpen}>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container product-upload-modal">
        <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close" onclick={handleCloseModal} title="닫기">
            <lightning-icon icon-name="utility:close" alternative-text="닫기" size="small"></lightning-icon>
          </button>
          <h2 class="slds-text-heading_medium">프로모션 상품 업로드</h2>
        </header>

        <div class="slds-modal__content slds-p-around_large modal-content">
          <template if:true={isParsing}>
            <lightning-spinner alternative-text="파일 검증 중"></lightning-spinner>
          </template>

          <template if:true={isUploading}>
            <lightning-spinner alternative-text="업로드 중"></lightning-spinner>
          </template>

          <div class="upload-action-row">
            <lightning-button label="파일 선택" onclick={handleSelectClick}></lightning-button>
            <div class="file-name">
              <template if:true={fileName}>
                <span>{fileName}</span>
              </template>
              <template if:false={fileName}>
                <span>CSV 파일을 선택해주세요. 헤더는 제품 코드(ProductCode__c)만 있으면 됩니다.</span>
              </template>
            </div>
          </div>

          <template if:true={hasPreviewResult}>
            <div class="upload-summary">
              <div class="upload-summary-card upload-summary-card--success">
                <div class="upload-summary-label">성공 건수</div>
                <div class="upload-summary-value">{successCount}</div>
              </div>
              <div class="upload-summary-card upload-summary-card--error">
                <div class="upload-summary-label">실패 건수</div>
                <div class="upload-summary-value">{failCount}</div>
              </div>
            </div>

            <template if:true={hasErrors}>
              <div class="result-section-title">오류 목록</div>
              <lightning-datatable key-field="key" data={errorRows} columns={errorColumns} hide-checkbox-column></lightning-datatable>
            </template>

            <template if:false={hasErrors}>
              <div class="empty-errors">오류가 없습니다. 업로드를 진행할 수 있습니다.</div>
            </template>
          </template>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button label="닫기" variant="neutral" onclick={handleCloseModal}></lightning-button>
          <lightning-button label={uploadButtonLabel} variant="brand" onclick={handleUploadClick} disabled={isUploadDisabled}></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>

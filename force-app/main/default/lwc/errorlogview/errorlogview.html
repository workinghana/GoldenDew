<template>
    <lightning-card title="Error Logs">
        <lightning-datatable key-field="Id" data={logs} columns={columns} hide-checkbox-column
            onrowaction={handleRowAction}>
        </lightning-datatable>
    </lightning-card>

    <!-- Error Detail Modal -->
    <template if:true={selectedLog}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Error Detail
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <p><b>Class</b>: {selectedLog.ApexClass__c}</p>
                    <p><b>Error</b>: {selectedLog.ErrorMessage__c}</p>

                    <p class="slds-m-top_medium"><b>StackTrace</b></p>
                    <pre class="slds-box slds-theme_shade">
                        {selectedLog.StackTrace__c}
                    </pre>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeModal}>
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

  </div>

            <div class="icon-circle blue">
              <lightning-icon icon-name="utility:moneybag" size="small"></lightning-icon>
            </div>
            <div class="block-title">주문 상세</div>
          </div>

          <template if:true={hasOrderRecordsButton}>
            <button class="pill-btn" onclick={handleOpenOrderRecordsModal}>{orderRecordsButtonLabel}</button>
          </template>
        </div>

        <p class="number-row">
          <span>주문번호</span>
          <template if:true={hasOrderNoLink}>
            <button type="button" class="number-link" onclick={handleNavigateOrder}>{orderNo}</button>
          </template>
          <template if:false={hasOrderNoLink}>
            <span>{orderNo}</span>
          </template>
        </p>
        <p><span>주문유형</span><span>{orderTypeLabel}</span></p>
        <p><span>주문매장</span><span>{orderStoreName}</span></p>
        <p><span>주문상태</span><span>{orderStatusLabel}</span></p>
        <p><span>주문일시</span><span>{orderDateText}</span></p>
      </div>

      <div class="detail-card summary-info-card order-info-card">
        <div class="card-header">
          <div class="header-left">
            <div class="icon-circle green">
              <lightning-icon icon-name="utility:package" size="small"></lightning-icon>
            </div>
            <div class="block-title">주문 정보</div>
          </div>
        </div>

        <div class="sale-detail-grid order-detail-grid">
          <section class="info-section order-summary-section">
            <p class="info-row sale-amount-row order-amount-row">
              <span class="info-row-label">주문금액</span>
              <span class="info-row-value">{totalAmountText}</span>
            </p>

            <div class="section-title-row sale-quantity-row">
              <div class="sale-section-title">주문수량</div>
              <div class="sale-quantity-inline">{orderQuantitySummaryText}</div>
            </div>

            <div class="products-header-row">
              <div class="sale-products-subtitle">주문 상품</div>
              <template if:true={hasOrderItems}>
                <button class="pill-btn pill-btn--compact inline-items-btn" onclick={handleOpenOrderItemsModal}>{orderItemsButtonLabel}</button>
              </template>
              <template if:false={hasOrderItems}>
                <div class="empty-state inline-empty-state">{orderEmptyText}</div>
              </template>
            </div>

            <template if:true={hasOrderItems}>
              <div class="product-list">
                <template for:each={visibleOrderItems} for:item="item">
                  <p key={item.orderItemId} class="info-row">
                    <span class="info-row-label">{item.productName}</span>
                    <span class="info-row-value">{item.summaryText}</span>
                  </p>
                </template>
              </div>
            </template>
          </section>

            <div class="sale-section-title section-title-emphasis">입금금액</div>
            <div class="payment-grid">
              <template for:each={orderPaymentItems} for:item="item">

                  <span class="info-row-label">{item.label}</span>
                  <span class="info-row-value">{item.value}</span>
                </p>

            <p class="info-row total-row">

            </p>

              <template if:false={hasSaleItems}>

  <template if:true={isSaleItemsModalOpen}>

                <th>판매번호</th>
                <th>상태</th>
                <th>판매일시</th>
                <th>판매매장</th>
                <th>판매금액</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={saleRecordRows} for:item="item">
                <tr key={item.key}>
                  <td>
                    <template if:true={item.navigable}>
                      <button type="button" class="number-link" data-order-id={item.navigationOrderId} onclick={handleNavigateRowOrder}>
                        {item.saleNo}
                      </button>
                    </template>
                    <template if:true={item.notNavigable}> {item.saleNo} </template>
                  </td>
                  <td>{item.status}</td>
                  <td>{item.saleDate}</td>
                  <td>{item.storeName}</td>
                  <td>{item.amount}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button label="닫기" onclick={handleCloseSaleRecordsModal}></lightning-button>
        </footer>
      </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>

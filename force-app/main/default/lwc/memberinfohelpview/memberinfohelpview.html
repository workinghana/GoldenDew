<template>
  <lightning-card title="회원 정보 도움창 (조회)" icon-name="standard:contact">
    <!-- 검색 영역 -->
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <div class="slds-grid slds-gutters slds-grid_vertical-align-end">
        <div class="slds-col slds-size_2-of-3">
          <lightning-input
            type="search"
            label="회원번호"
            placeholder="회원번호를 입력하고 Enter 또는 [조회] 클릭"
            value={memberNoInput}
            onchange={handleInputChange}
            onkeyup={handleKeyUp}
            autocomplete="off"
          >
          </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3">
          <lightning-button
            label="조회"
            variant="brand"
            icon-name="utility:search"
            onclick={handleSearch}
            disabled={isLoading}
            class="slds-m-right_x-small"
          >
          </lightning-button>
          <lightning-button label="초기화" variant="neutral" onclick={handleReset} disabled={isLoading}> </lightning-button>
        </div>
      </div>

      <template if:true={searchedMemberNo}>
        <div class="slds-box slds-theme_shade slds-m-top_medium">
          <div class="slds-grid slds-grid_align-spread slds-wrap">
            <div class="slds-m-right_large">
              <strong>조회 회원번호:</strong>
              <span class="slds-m-left_x-small">{searchedMemberNo}</span>
            </div>
            <div class="slds-m-right_large">
              <strong>전체 포인트:</strong>
              <span class="slds-m-left_x-small">{totalPointsLabel}</span>
            </div>
            <div>
              <strong>결제가능 포인트:</strong>
              <span class="slds-m-left_x-small">{payablePointsLabel}</span>
            </div>
          </div>
        </div>
      </template>

      <!-- JSON 직접 입력 패널 (접기/펼치기) -->
      <div class="slds-m-top_medium">
        <button type="button" class="slds-button slds-button_neutral" onclick={toggleJsonPanel}>{jsonPanelLabel}</button>
      </div>
      <template if:true={showJsonPanel}>
        <div class="slds-box slds-m-top_x-small">
          <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
            전체 응답(<code>&#123; success, data: &#123; AccrualHistoryList, UserDestoryHistoryList &#125; &#125;</code>) 또는
            <code>data</code> 객체만 붙여넣어도 됩니다. 아래 표가 입력한 JSON 기준으로 다시 그려집니다.
          </p>
          <lightning-textarea
            label="JSON 응답"
            value={jsonInput}
            onchange={handleJsonInputChange}
            placeholder="JSON 응답 전체 또는 data 객체를 붙여넣으세요"
            class="json-textarea"
          >
          </lightning-textarea>
          <div class="slds-m-top_x-small">
            <lightning-button label="JSON 적용" variant="brand" onclick={handleApplyJson} class="slds-m-right_x-small"> </lightning-button>
            <lightning-button label="입력 지우기" variant="neutral" onclick={handleClearJson}> </lightning-button>
          </div>
        </div>
      </template>
    </div>

    <!-- 결과 영역 -->
    <div class="slds-is-relative">
      <template if:true={isLoading}>
        <lightning-spinner alternative-text="조회 중" size="medium"></lightning-spinner>
      </template>

      <template if:true={hasSearched}>
        <!-- ===== 적립 내역 ===== -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
          <div class="slds-text-heading_small slds-p-vertical_x-small slds-border_bottom slds-m-bottom_x-small">▶ 적립 내역 ({accrualCount})</div>

          <template if:true={hasAccrualRows}>
            <div class="table-scroll">
              <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout grid-table">
                <thead>
                  <tr class="slds-text-align_center">
                    <th rowspan="2" class="col-idx">No</th>
                    <th rowspan="2">적립월</th>
                    <th rowspan="2">포인트구분</th>
                    <th rowspan="2">적립구분</th>
                    <th colspan="2">적립</th>
                    <th rowspan="2">사용포인트</th>
                    <th rowspan="2">소멸포인트</th>
                    <th colspan="2">유효기간</th>
                    <th colspan="2">소멸일</th>
                    <th colspan="5">판매정보</th>
                    <th rowspan="2">회원프로모션 번호</th>
                  </tr>
                  <tr class="slds-text-align_center">
                    <th>적립일</th>
                    <th>적립포인트</th>
                    <th>시작일</th>
                    <th>종료일</th>
                    <th>소멸예정일</th>
                    <th>판매삭제일</th>
                    <th>판매번호</th>
                    <th>판매금액</th>
                    <th>적립대상포인트</th>
                    <th>사용포인트</th>
                    <th>사용쿠폰</th>
                  </tr>
                  <tr class="sum-row">
                    <td colspan="5" class="slds-text-align_right"><strong>합계</strong></td>
                    <td class="num">{accrualSums.PT_SAVE}</td>
                    <td class="num">{accrualSums.PT_USE}</td>
                    <td class="num">{accrualSums.PT_DESTROY}</td>
                    <td colspan="4"></td>
                    <td></td>
                    <td class="num">{accrualSums.AM_SAL}</td>
                    <td class="num">{accrualSums.PT_TARGET}</td>
                    <td class="num">{accrualSums.PT_USE_SALE}</td>
                    <td class="num">{accrualSums.PT_USE_SALE_COUPON}</td>
                    <td></td>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={accrualRows} for:item="r">
                    <tr key={r._key}>
                      <td class="col-idx slds-text-align_center">{r._idx}</td>
                      <td>{r.YM_CREATE}</td>
                      <td>{r.NM_TYPE_POINT}</td>
                      <td>{r.NM_TYPE_SAVE}</td>
                      <td>{r.DT_SAVE}</td>
                      <td class="num">{r.PT_SAVE}</td>
                      <td class="num">{r.PT_USE}</td>
                      <td class="num">{r.PT_DESTROY}</td>
                      <td>{r.DT_LIMIT_START}</td>
                      <td>{r.DT_LIMIT_END}</td>
                      <td>{r.DT_DESTROY_PLAN}</td>
                      <td>{r.DT_DESTROY_DEL_SALE}</td>
                      <td>{r.NO_SAL}</td>
                      <td class="num">{r.AM_SAL}</td>
                      <td class="num">{r.PT_TARGET}</td>
                      <td class="num">{r.PT_USE_SALE}</td>
                      <td class="num">{r.PT_USE_SALE_COUPON}</td>
                      <td>{r.NO_PROM_MBR}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template if:false={hasAccrualRows}>
            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">적립 내역이 없습니다.</div>
          </template>
        </div>

        <!-- ===== 사용/소멸 내역 ===== -->
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
          <div class="slds-text-heading_small slds-p-vertical_x-small slds-border_bottom slds-m-bottom_x-small">
            ▶ 사용/소멸 내역 ({redemptionCount})
          </div>

          <template if:true={hasRedemptionRows}>
            <div class="table-scroll">
              <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout grid-table">
                <thead>
                  <tr class="slds-text-align_center">
                    <th class="col-idx">No</th>
                    <th>발생월</th>
                    <th>포인트구분</th>
                    <th>소진구분</th>
                    <th>사용/소멸일</th>
                    <th>사용/소멸포인트</th>
                    <th>판매번호</th>
                    <th>판매금액</th>
                    <th>적립판매번호</th>
                    <th>적립일</th>
                    <th>판매반품번호</th>
                    <th>주문번호</th>
                  </tr>
                  <tr class="sum-row">
                    <td colspan="5" class="slds-text-align_right"><strong>합계</strong></td>
                    <td class="num">{redemptionSums.PT_USE}</td>
                    <td></td>
                    <td class="num">{redemptionSums.AM_SAL}</td>
                    <td colspan="4"></td>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={redemptionRows} for:item="r">
                    <tr key={r._key}>
                      <td class="col-idx slds-text-align_center">{r._idx}</td>
                      <td>{r.YM_CREATE}</td>
                      <td>{r.NM_TYPE_POINT}</td>
                      <td>{r.NM_PERSON}</td>
                      <td>{r.DT_USE}</td>
                      <td class="num">{r.PT_USE}</td>
                      <td>{r.NO_SAL}</td>
                      <td class="num">{r.AM_SAL}</td>
                      <td>{r.NO_SAL_SAVE}</td>
                      <td>{r.DT_SAVE}</td>
                      <td>{r.NO_SAL_RTN}</td>
                      <td>{r.NO_SAL_ORD}</td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template if:false={hasRedemptionRows}>
            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">사용/소멸 내역이 없습니다.</div>
          </template>
        </div>
      </template>

      <template if:false={hasSearched}>
        <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">회원번호를 입력하고 [조회] 버튼을 눌러주세요.</div>
      </template>
    </div>

    <!-- ===== 회원 포인트 사용 도움창 ===== -->
    <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-m-top_medium">
      <div class="slds-border_top slds-p-top_medium slds-m-bottom_small">
        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-icon icon-name="standard:reward" size="small" alternative-text="회원 포인트 사용 도움창" class="slds-m-right_small">
          </lightning-icon>
          <h2 class="slds-text-heading_small slds-text-color_default">회원 포인트 사용 도움창 (조회)</h2>
        </div>
      </div>

      <!-- 검색 영역 -->
      <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <div class="store-search">
            <lightning-input
              type="search"
              label="매장 이름"
              data-context="point"
              value={pointStoreKeyword}
              oninput={handleStoreNameChange}
              onkeyup={handleStoreNameChange}
              onblur={handleStoreInputBlur}
              placeholder="매장 이름으로 검색"
              autocomplete="off"
            >
            </lightning-input>
            <template if:true={hasPointStoreOptions}>
              <div class="store-search__list slds-dropdown slds-dropdown_fluid slds-dropdown_length-5">
                <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                  <template for:each={pointStoreOptions} for:item="option">
                    <li key={option.value} role="presentation" class="slds-listbox__item">
                      <button
                        type="button"
                        class="store-search__option slds-button slds-button_reset slds-listbox__option slds-listbox__option_plain"
                        data-context="point"
                        data-code={option.storeCode}
                        data-name={option.storeName}
                        onmousedown={handleStoreOptionSelect}
                      >
                        <span class="slds-truncate">{option.storeName}</span>
                        <span class="store-search__code slds-text-color_weak">{option.storeCode}</span>
                      </button>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="text"
            label="회원 번호 (필수)"
            name="MemberNo__c"
            data-field="MemberNo__c"
            value={pointHelpForm.MemberNo__c}
            onchange={handlePointHelpFieldChange}
            onkeyup={handlePointHelpKeyUp}
            required
            placeholder="회원 번호"
            autocomplete="off"
          >
          </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="text"
            label="프로모션 번호"
            name="PromotionNo__c"
            data-field="PromotionNo__c"
            value={pointHelpForm.PromotionNo__c}
            onchange={handlePointHelpFieldChange}
            onkeyup={handlePointHelpKeyUp}
            placeholder="프로모션 번호"
            autocomplete="off"
          >
          </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="text"
            label="주문/판매 일자"
            name="OrderDate"
            data-field="OrderDate"
            value={pointHelpForm.OrderDate}
            onchange={handlePointHelpFieldChange}
            onkeyup={handlePointHelpKeyUp}
            placeholder="YYYYMMDD (예: 20260406)"
            autocomplete="off"
          >
          </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="text"
            label="판매 번호"
            name="SaleNo__c"
            data-field="SaleNo__c"
            value={pointHelpForm.SaleNo__c}
            onchange={handlePointHelpFieldChange}
            onkeyup={handlePointHelpKeyUp}
            placeholder="판매 번호"
            autocomplete="off"
          >
          </lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small slds-grid slds-grid_vertical-align-end">
          <lightning-button
            label="조회"
            variant="brand"
            icon-name="utility:search"
            onclick={handlePointHelpSearch}
            disabled={pointHelpLoading}
            class="slds-m-right_x-small"
          >
          </lightning-button>
          <lightning-button label="초기화" variant="neutral" onclick={handlePointHelpReset} disabled={pointHelpLoading}> </lightning-button>
        </div>
      </div>

      <!-- JSON 직접 입력 패널 (접기/펼치기) -->
      <div class="slds-m-top_medium">
        <button type="button" class="slds-button slds-button_neutral" onclick={togglePointHelpJsonPanel}>{pointHelpJsonPanelLabel}</button>
      </div>
      <template if:true={showPointHelpJsonPanel}>
        <div class="slds-box slds-m-top_x-small">
          <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
            전체 응답(<code>&#123; success, data: &#123; pointList &#125; &#125;</code>) / <code>data</code> 객체 / <code>pointList 배열</code> 어느
            형태든 가능합니다. 아래 표가 입력한 JSON 기준으로 다시 그려집니다.
          </p>
          <lightning-textarea
            label="JSON 응답"
            value={pointHelpJsonInput}
            onchange={handlePointHelpJsonChange}
            placeholder="JSON 응답 전체 또는 data 객체, 또는 pointList 배열을 붙여넣으세요"
            class="json-textarea"
          >
          </lightning-textarea>
          <div class="slds-m-top_x-small">
            <lightning-button label="JSON 적용" variant="brand" onclick={handlePointHelpApplyJson} class="slds-m-right_x-small"> </lightning-button>
            <lightning-button label="입력 지우기" variant="neutral" onclick={handlePointHelpClearJson}> </lightning-button>
          </div>
        </div>
      </template>

      <!-- 결과 영역 -->
      <div class="slds-is-relative slds-m-top_medium">
        <template if:true={pointHelpLoading}>
          <lightning-spinner alternative-text="조회 중" size="small"></lightning-spinner>
        </template>

        <template if:true={pointHelpSearched}>
          <!-- 회원정보도움창과 동일한 회색 박스(가로 배열) -->
          <template if:true={pointHelpMemberNo}>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
              <div class="slds-grid slds-grid_align-spread slds-wrap">
                <div class="slds-m-right_large">
                  <strong>조회 회원번호:</strong>
                  <span class="slds-m-left_x-small">{pointHelpMemberNo}</span>
                </div>
                <div class="slds-m-right_large">
                  <strong>전체 포인트:</strong>
                  <span class="slds-m-left_x-small">{pointHelpTotalLabel}</span>
                </div>
                <div>
                  <strong>결제가능 포인트:</strong>
                  <span class="slds-m-left_x-small">{pointHelpPayableLabel}</span>
                </div>
              </div>
            </div>
          </template>

          <!-- 유형별 포인트 표 -->
          <div class="slds-text-heading_small slds-p-vertical_x-small slds-border_bottom slds-m-bottom_x-small">▶ 유형별 포인트</div>
          <template if:true={hasPointHelpRows}>
            <table class="slds-table slds-table_bordered slds-table_cell-buffer point-type-table">
              <thead>
                <tr class="slds-text-align_center">
                  <th class="col-idx">No</th>
                  <th>포인트 구분</th>
                  <th>포인트</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={pointHelpRows} for:item="p">
                  <tr key={p._key}>
                    <td class="col-idx slds-text-align_center">{p._idx}</td>
                    <td>{p.label}</td>
                    <td class="num">{p.pointsLabel}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
          <template if:false={hasPointHelpRows}>
            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">유형별 포인트 데이터가 없습니다.</div>
          </template>
        </template>

        <template if:false={pointHelpSearched}>
          <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">회원번호를 입력하고 [조회] 버튼을 눌러주세요.</div>
        </template>
      </div>
    </div>

    <!-- ===== 사용 가능한 쿠폰 도움창 ===== -->
    <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-m-top_medium">
      <div class="slds-border_top slds-p-top_medium slds-m-bottom_small">
        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-icon
            icon-name="standard:coupon_codes"
            size="small"
            alternative-text="사용 가능한 쿠폰 도움창"
            class="slds-m-right_small"
          ></lightning-icon>
          <h2 class="slds-text-heading_small slds-text-color_default">사용 가능한 쿠폰 도움창 (조회)</h2>
        </div>
      </div>

      <!-- 검색 영역 -->
      <div class="slds-grid slds-gutters slds-wrap">
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <div class="store-search">
            <lightning-input
              type="search"
              label="매장 이름(매장 코드)"
              data-context="voucher"
              value={voucherStoreKeyword}
              oninput={handleStoreNameChange}
              onkeyup={handleStoreNameChange}
              onblur={handleStoreInputBlur}
              placeholder="매장 이름으로 검색"
              autocomplete="off"
            >
            </lightning-input>
            <template if:true={hasVoucherStoreOptions}>
              <div class="store-search__list slds-dropdown slds-dropdown_fluid slds-dropdown_length-5">
                <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                  <template for:each={voucherStoreOptions} for:item="option">
                    <li key={option.value} role="presentation" class="slds-listbox__item">
                      <button
                        type="button"
                        class="store-search__option slds-button slds-button_reset slds-listbox__option slds-listbox__option_plain"
                        data-context="voucher"
                        data-code={option.storeCode}
                        data-name={option.storeName}
                        onmousedown={handleStoreOptionSelect}
                      >
                        <span class="slds-truncate">{option.storeName}</span>
                        <span class="store-search__code slds-text-color_weak">{option.storeCode}</span>
                      </button>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="text"
            label="회원 번호"
            data-field="MemberNo__c"
            value={voucherHelpForm.MemberNo__c}
            onchange={handleVoucherHelpFieldChange}
            required
            placeholder="예: CAR20260319004"
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="number"
            label="판매금액"
            data-field="ActualPaymentAmount__c"
            value={voucherHelpForm.ActualPaymentAmount__c}
            onchange={handleVoucherHelpFieldChange}
            step="0.01"
            placeholder="예: 1000"
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-combobox
            label="주문 구분 코드"
            data-field="Type"
            value={voucherHelpForm.Type}
            options={orderTypeOptions}
            onchange={handleVoucherHelpFieldChange}
            placeholder="주문 구분을 선택하세요"
          ></lightning-combobox>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small">
          <lightning-input
            type="text"
            label="프로모션 번호"
            data-field="PromotionNo__c"
            value={voucherHelpForm.PromotionNo__c}
            onchange={handleVoucherHelpFieldChange}
            placeholder="예: 2026010701"
          ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-3 slds-p-bottom_small slds-grid slds-grid_vertical-align-end">
          <lightning-button
            label="조회"
            variant="brand"
            icon-name="utility:search"
            onclick={handleVoucherHelpSearch}
            disabled={voucherHelpLoading}
            class="slds-m-right_x-small"
          ></lightning-button>
          <lightning-button label="초기화" variant="neutral" onclick={handleVoucherHelpReset} disabled={voucherHelpLoading}></lightning-button>
        </div>
      </div>

      <!-- 주문 상세 (OrderItem) 토글 -->
      <div class="slds-m-top_x-small">
        <lightning-input
          type="checkbox"
          label="주문 상세(OrderItem) 포함"
          checked={voucherHelpIncludeItem}
          onchange={handleVoucherHelpItemToggle}
        ></lightning-input>
      </div>
      <template if:true={voucherHelpIncludeItem}>
        <div class="slds-grid slds-gutters slds-wrap slds-m-top_x-small slds-box slds-theme_shade">
          <div class="slds-col slds-size_1-of-4 slds-p-bottom_small">
            <lightning-input
              type="text"
              label="상품 코드 (ProductCode)"
              data-field="ProductCode"
              value={voucherHelpItem.ProductCode}
              onchange={handleVoucherHelpItemFieldChange}
              placeholder="예: 212100060"
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-4 slds-p-bottom_small">
            <lightning-input
              type="number"
              label="수량 (Quantity)"
              data-field="Quantity"
              value={voucherHelpItem.Quantity}
              onchange={handleVoucherHelpItemFieldChange}
              step="1"
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-4 slds-p-bottom_small">
            <lightning-input
              type="number"
              label="판매단가 (NetSalesUnitPrice__c)"
              data-field="NetSalesUnitPrice__c"
              value={voucherHelpItem.NetSalesUnitPrice__c}
              onchange={handleVoucherHelpItemFieldChange}
              step="0.01"
            ></lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-4 slds-p-bottom_small">
            <lightning-input
              type="number"
              label="할인율 (DiscountRate__c)"
              data-field="DiscountRate__c"
              value={voucherHelpItem.DiscountRate__c}
              onchange={handleVoucherHelpItemFieldChange}
              step="0.01"
            ></lightning-input>
          </div>
        </div>
      </template>

      <!-- JSON 직접 입력 패널 -->
      <div class="slds-m-top_medium">
        <button type="button" class="slds-button slds-button_neutral" onclick={toggleVoucherHelpJsonPanel}>{voucherHelpJsonPanelLabel}</button>
      </div>
      <template if:true={showVoucherHelpJsonPanel}>
        <div class="slds-box slds-m-top_x-small">
          <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
            전체 응답(<code>&#123; success, data: &#123; couponList &#125; &#125;</code>) / <code>data</code> / <code>couponList 배열</code> 어떤
            형태든 가능합니다.
          </p>
          <lightning-textarea
            label="JSON 응답"
            value={voucherHelpJsonInput}
            onchange={handleVoucherHelpJsonChange}
            placeholder="JSON 응답 전체 또는 data 객체, 또는 couponList 배열을 붙여넣으세요"
            class="json-textarea"
          ></lightning-textarea>
          <div class="slds-m-top_x-small">
            <lightning-button label="JSON 적용" variant="brand" onclick={handleVoucherHelpApplyJson} class="slds-m-right_x-small"></lightning-button>
            <lightning-button label="입력 지우기" variant="neutral" onclick={handleVoucherHelpClearJson}></lightning-button>
          </div>
        </div>
      </template>

      <!-- 결과 영역 -->
      <div class="slds-is-relative slds-m-top_medium">
        <template if:true={voucherHelpLoading}>
          <lightning-spinner alternative-text="조회 중" size="small"></lightning-spinner>
        </template>

        <template if:true={voucherHelpSearched}>
          <div class="slds-text-heading_small slds-p-vertical_x-small slds-border_bottom slds-m-bottom_x-small">
            ▶ 사용 가능 쿠폰 ({voucherHelpRowsCount})
          </div>
          <template if:true={hasVoucherHelpRows}>
            <div class="table-scroll">
              <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout grid-table">
                <thead>
                  <tr class="slds-text-align_center">
                    <th class="col-idx">No</th>
                    <th>쿠폰 코드</th>
                    <th>쿠폰명</th>
                    <th>액면가</th>
                    <th>유효기간 (시작)</th>
                    <th>유효기간 (종료)</th>
                    <th>상태</th>
                    <th>원본 JSON</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={voucherHelpRows} for:item="v">
                    <tr key={v._key}>
                      <td class="col-idx slds-text-align_center">{v._idx}</td>
                      <td>{v.code}</td>
                      <td>{v.name}</td>
                      <td class="num">{v.faceValueLabel}</td>
                      <td>{v.startDate}</td>
                      <td>{v.endDate}</td>
                      <td>{v.status}</td>
                      <td><pre class="raw-json">{v._raw}</pre></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template if:false={hasVoucherHelpRows}>
            <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">사용 가능한 쿠폰이 없습니다.</div>
          </template>

          <template if:true={voucherHelpMessage}>
            <div class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">응답 메시지: <strong>{voucherHelpMessage}</strong></div>
          </template>
        </template>

        <template if:false={voucherHelpSearched}>
          <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">회원 번호 + 필요 정보 입력 후 [조회] 버튼을 눌러주세요.</div>
        </template>
      </div>
    </div>

    <!-- ===== 포인트 개별 지급 (JSON 입력) ===== -->
    <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-m-top_medium">
      <div class="slds-border_top slds-p-top_medium">
        <button type="button" class="slds-button slds-button_neutral" onclick={toggleCreditPanel}>{creditPanelLabel}</button>
      </div>

      <template if:true={showCreditPanel}>
        <div class="slds-box slds-m-top_x-small">
          <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
            <code>POST /services/apexrest/gd/v1/point/credit</code> 와 동일한 요청 본문(JSON)을 입력하세요. 지급 성공/실패만 표시됩니다.
          </p>
          <lightning-textarea
            label="포인트 지급 JSON"
            value={creditJsonInput}
            onchange={handleCreditJsonChange}
            placeholder="포인트 지급 요청 JSON 본문을 붙여넣으세요"
            class="json-textarea"
          >
          </lightning-textarea>
          <div class="slds-m-top_x-small">
            <lightning-button label="포인트 지급" variant="brand" onclick={handleCreditSubmit} disabled={isCrediting} class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button label="입력 지우기" variant="neutral" onclick={handleClearCreditJson} disabled={isCrediting}> </lightning-button>
          </div>

          <template if:true={isCrediting}>
            <div class="slds-m-top_x-small slds-text-color_weak slds-is-relative" style="min-height: 32px">
              <lightning-spinner alternative-text="지급 중" size="small"></lightning-spinner>
            </div>
          </template>

          <template if:true={creditResult}>
            <div class={creditResultClass}>{creditResultText}</div>
          </template>
        </div>
      </template>
    </div>
  </lightning-card>
</template>

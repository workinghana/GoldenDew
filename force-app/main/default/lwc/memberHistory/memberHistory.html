<template>
    <lightning-card>

        <template if:true={histories}>
            <lightning-datatable
                key-field="changeDate"
                data={histories}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                변경 이력을 불러오는 중 오류가 발생했습니다.
            </div>
        </template>

    </lightning-card>
</template>

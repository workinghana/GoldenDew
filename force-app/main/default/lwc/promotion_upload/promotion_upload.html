<template>
  <lightning-card>
    <div class="upload-card-header slds-p-horizontal_medium slds-p-vertical_small">
      <div class="upload-card-title-group">
        <lightning-icon icon-name="standard:product_request" size="small" class="upload-card-icon"></lightning-icon>
        <div class="upload-card-title">프로모션 일괄 업로드</div>
      </div>
      <div class="upload-button-group">
        <lightning-button label="제품 등록" variant="brand" onclick={handleOpenProductModal}></lightning-button>
        <lightning-button label="매장 등록" variant="neutral" onclick={handleOpenStoreModal}></lightning-button>
      </div>
    </div>
  </lightning-card>

  <input class="file-input" type="file" accept=".csv" onchange={handleFileChange} />

  <template if:true={isModalOpen}>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container upload-modal">
        <header class="slds-modal__header">
          <button class="slds-button slds-button_icon slds-modal__close" onclick={handleCloseModal} title="닫기">
            <lightning-icon icon-name="utility:close" alternative-text="닫기" size="small"></lightning-icon>
          </button>
          <h2 class="slds-text-heading_medium">{modalTitle}</h2>
        </header>

        <div class="slds-modal__content slds-p-around_large modal-content">
          <template if:true={isParsing}>
            <lightning-spinner alternative-text="파일 검증 중"></lightning-spinner>
          </template>

          <template if:true={isUploading}>
            <lightning-spinner alternative-text="업로드 중"></lightning-spinner>
          </template>

          <div class={dropZoneClass} ondragenter={handleDragEnter} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
            <lightning-icon icon-name="utility:upload" size="large" class="drop-zone-icon"></lightning-icon>
            <div class="drop-zone-title">파일을 이곳에 끌어 놓으세요</div>
            <div class="drop-zone-subtitle">또는 아래 버튼을 눌러 CSV 파일을 선택하세요.</div>
            <lightning-button label="파일 업로드" variant="brand" onclick={handleSelectClick}></lightning-button>

            <template if:true={fileName}>
              <div class="selected-file-name">{fileName}</div>
            </template>
          </div>

          <div class="upload-guide">
            <div class="guide-title">업로드 안내</div>
            <div class="guide-text">{fileGuideText}</div>
          </div>

          <template if:true={hasPreviewResult}>
            <div class="upload-summary">
              <div class="upload-summary-card upload-summary-card--success">
                <div class="upload-summary-label">성공 건수</div>
                <div class="upload-summary-value">{successCount}</div>
              </div>
              <div class="upload-summary-card upload-summary-card--error">
                <div class="upload-summary-label">실패 건수</div>
                <div class="upload-summary-value">{failCount}</div>
              </div>
            </div>

            <template if:true={hasCompletionMessage}>
              <div class="upload-complete-message">{completionMessage}</div>
            </template>

            <template if:true={hasErrors}>
              <template if:false={hasUploaded}>
                <div class="result-section-title">오류 목록</div>
                <lightning-datatable key-field="key" data={errorRows} columns={errorColumns} hide-checkbox-column></lightning-datatable>
              </template>
            </template>

            <template if:false={hasErrors}>
              <div class="empty-errors">오류가 없습니다. 업로드를 진행할 수 있습니다.</div>
            </template>
          </template>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button label="닫기" variant="neutral" onclick={handleCloseModal}></lightning-button>
          <lightning-button label={uploadButtonLabel} variant="brand" onclick={handleUploadClick} disabled={isUploadDisabled}></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
